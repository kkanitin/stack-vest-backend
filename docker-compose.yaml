services:
  postgres:
    image: postgres:17
    container_name: stackvest-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stackvest
    volumes:
      - /path/to/your/local/data/db:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: stackvest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
